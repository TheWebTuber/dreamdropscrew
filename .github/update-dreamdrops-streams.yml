name: Update Dream Drops Crew livestreams

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, offset to avoid GitHub's busy top-of-hour window (UTC).
    - cron: '17 */3 * * *'

permissions:
  contents: write

jobs:
  update-livestreams:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch recent YouTube livestreams
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLE: DreamDropsCrew
          SITE_DIR: dreamdropscrew
        run: python3 dreamdropscrew/scripts/update_livestreams.py

      - name: Save refreshed feed (only when it changes)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dreamdropscrew/data/livestreams.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update latest Dream Drops Crew livestreams'
            git push
          else
            echo 'No new streams to publish.'
          fi
